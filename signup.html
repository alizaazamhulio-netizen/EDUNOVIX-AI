<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Novix</title>

    <link rel="stylesheet" href="signup.css">
  <link rel="stylesheet" href="edunexa-theme.css">
</head>

<body>

    <form id="signupForm">

        <input type="text" id="name" placeholder="Full Name" autocomplete="name" minlength="2" required>

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="password" id="password" placeholder="Password (10+ characters, letters and numbers)" autocomplete="new-password" minlength="10" required>

        <input type="password" id="confirmPassword" placeholder="Confirm Password" autocomplete="new-password" minlength="10" required>

        <button type="submit" id="signupBtn">
            Create Account
        </button>
        <p id="signupMessage" class="auth-feedback" role="status" aria-live="polite"></p>

    </form>

    <script type="module" src="signup.js"></script>

</body>
</html>
