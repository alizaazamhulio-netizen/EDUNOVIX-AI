<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner - NOVIX
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Base Theme & Planner Styles -->
  <link rel="stylesheet" href="progress.css">
  <link rel="stylesheet" href="planner.css">
</head>
<body>
  <div class="app-container">
    <!-- ==========================================
         1. LEFT SIDEBAR NAVIGATION
         ========================================== -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <div class="logo-icon"><i class="fa-solid fa-brain"></i></div>
          <div class="logo-title-group">
            <span class="logo-text">StudyMate</span>
            <span class="logo-badge">AI</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-section-title">Core Workspace</div>
          <a href="dashboard.html" class="nav-item">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Dashboard</span>
          </a>
          <a href="subjects.html" class="nav-item">
            <i class="fa-solid fa-book-bookmark"></i>
            <span>Subjects</span>
          </a>
          <a href="planner.html" class="nav-item active">
            <i class="fa-solid fa-calendar-days"></i>
            <span>Planner</span>
            <div class="active-indicator"></div>
          </a>
          <a href="ai-assistant.html" class="nav-item">
            <i class="fa-solid fa-robot"></i>
            <span>AI Assistant</span>
          </a>
          <a href="progress.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Progress</span>
          </a>
          
          <div class="nav-section-title" style="margin-top: 16px;">Preferences</div>
          <a href="settings.html" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="sidebarAvatar">AV<div class="online-dot"></div></div>
          <div class="user-info">
            <span class="user-name" id="sidebarUserName">Alex Vance</span>
            <span class="user-role">Premium Scholar</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ==========================================
         MAIN CONTENT WRAPPER
         ========================================== -->
    <main class="main-wrapper">
      <!-- ==========================================
           2. TOP HEADER
           ========================================== -->
      <header class="top-header">
        <div class="header-left">
          <h1 class="page-title"><i class="fa-solid fa-calendar-days"></i> Study Planner</h1>
          <p class="page-subtitle">Master your academic schedule, task deadlines & study blocks with AI precision</p>
        </div>

        <div class="header-right">
          <!-- Search Bar -->
          <div class="header-search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="plannerSearchInput" placeholder="Search tasks, subjects, schedules... (Ctrl+K)">
            <kbd class="search-kbd">⌘K</kbd>
          </div>

          <!-- Live Date & Clock -->
          <div class="header-clock" id="liveClockDisplay">
            <div class="time-text" id="liveTimeText">00:00 AM</div>
            <div class="date-text" id="liveDateText"><i class="fa-regular fa-calendar"></i> <span>Sat, Aug 1</span></div>
          </div>

          <!-- Notification Button -->
          <button class="header-action-btn" id="notifBtn" title="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="notif-badge">3</span>
          </button>

          <!-- Dark / Light Mode Toggle -->
          <button class="header-action-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
          </button>

          <!-- User Avatar Badge -->
          <div class="header-user-badge">
            <div class="mini-avatar">AV</div>
          </div>
        </div>
      </header>

      <!-- ==========================================
           MAIN PLANNER CONTENT GRID & RIGHT SIDEBAR
           ========================================== -->
      <div class="content-area planner-layout-container">
        
        <!-- MAIN CONTENT COLUMN (LEFT / CENTER) -->
        <div class="planner-main-column">
          
          <!-- ==========================================
               3. HERO SECTION
               ========================================== -->
          <section class="glass-card hero-planner-card" id="heroPlannerCard">
            <div class="hero-bg-decoration">
              <div class="floating-orb orb-1"></div>
              <div class="floating-orb orb-2"></div>
            </div>

            <div class="hero-content">
              <div class="hero-left-text">
                <div class="hero-badge"><i class="fa-solid fa-sparkles"></i> AI Study Optimizer Active</div>
                <h2 class="hero-headline">Today's Academic Strategy</h2>
                <p class="hero-quote" id="motivationalQuoteText">
                  "Success is the sum of small efforts repeated day in and day out."
                </p>

                <div class="hero-stats-row">
                  <div class="hero-stat-pill">
                    <span class="label"><i class="fa-solid fa-bullseye"></i> Current Focus Subject</span>
                    <span class="val text-indigo" id="heroCurrentFocus">Mathematics &bull; Calculus II</span>
                  </div>
                  <div class="hero-stat-pill">
                    <span class="label"><i class="fa-solid fa-clock"></i> Daily Goal</span>
                    <span class="val" id="heroDailyGoal">3.5 / 4.5 Hrs</span>
                  </div>
                  <div class="hero-stat-pill">
                    <span class="label"><i class="fa-solid fa-chart-line"></i> Weekly Pace</span>
                    <span class="val text-emerald" id="heroWeeklyPace">22.5 / 30.0 Hrs</span>
                  </div>
                </div>
              </div>

              <!-- Animated Progress Ring & Task Meter -->
              <div class="hero-right-ring">
                <div class="progress-ring-wrapper">
                  <svg class="progress-ring-svg" width="130" height="130">
                    <circle class="ring-bg" cx="65" cy="65" r="54"></circle>
                    <circle class="ring-fill" id="heroProgressCircle" cx="65" cy="65" r="54" style="stroke-dashoffset: 85;"></circle>
                  </svg>
                  <div class="ring-center-content">
                    <span class="percent-val" id="heroProgressPercent">78%</span>
                    <span class="percent-label">Completed</span>
                  </div>
                </div>
                <div class="hero-tasks-counter">
                  <span id="heroCompletedTasksCount">5</span> of <span id="heroTotalTasksCount">7</span> Tasks Done
                  <div class="remaining-tag" id="heroRemainingTasksTag"><i class="fa-solid fa-hourglass-half"></i> 2 Remaining</div>
                </div>
              </div>
            </div>
          </section>

          <!-- ==========================================
               4. QUICK ACTIONS
               ========================================== -->
          <section class="planner-section-block">
            <div class="section-title-row">
              <h3><i class="fa-solid fa-bolt text-amber"></i> Quick Actions</h3>
              <span class="section-badge">Fast Tools</span>
            </div>

            <div class="quick-actions-grid">
              <button class="quick-action-card" id="qaAddTaskBtn">
                <div class="qa-icon-box icon-indigo"><i class="fa-solid fa-plus"></i></div>
                <div class="qa-info">
                  <span class="qa-title">Add Task</span>
                  <span class="qa-desc">New assignment or goal</span>
                </div>
              </button>

              <button class="quick-action-card" id="qaAddSubjectBtn">
                <div class="qa-icon-box icon-emerald"><i class="fa-solid fa-book-medical"></i></div>
                <div class="qa-info">
                  <span class="qa-title">Add Subject</span>
                  <span class="qa-desc">Track new course module</span>
                </div>
              </button>

              <button class="quick-action-card" id="qaStartSessionBtn">
                <div class="qa-icon-box icon-cyan"><i class="fa-solid fa-play"></i></div>
                <div class="qa-info">
                  <span class="qa-title">Start Study Session</span>
                  <span class="qa-desc">Log live study time</span>
                </div>
              </button>

              <a href="ai-assistant.html" class="quick-action-card">
                <div class="qa-icon-box icon-purple"><i class="fa-solid fa-robot"></i></div>
                <div class="qa-info">
                  <span class="qa-title">Open AI Assistant</span>
                  <span class="qa-desc">Ask homework questions</span>
                </div>
              </a>

              <button class="quick-action-card" id="qaGenerateNotesBtn">
                <div class="qa-icon-box icon-rose"><i class="fa-solid fa-file-pen"></i></div>
                <div class="qa-info">
                  <span class="qa-title">Generate Notes</span>
                  <span class="qa-desc">AI summary from topic</span>
                </div>
              </button>

              <button class="quick-action-card" id="qaGenerateQuizBtn">
                <div class="qa-icon-box icon-amber"><i class="fa-solid fa-circle-question"></i></div>
                <div class="qa-info">
                  <span class="qa-title">Generate Quiz</span>
                  <span class="qa-desc">Practice exam questions</span>
                </div>
              </button>

              <button class="quick-action-card" id="qaStartRevisionBtn">
                <div class="qa-icon-box icon-teal"><i class="fa-solid fa-rotate"></i></div>
                <div class="qa-info">
                  <span class="qa-title">Start Revision</span>
                  <span class="qa-desc">Spaced repetition review</span>
                </div>
              </button>

              <button class="quick-action-card" id="qaPomodoroScrollBtn">
                <div class="qa-icon-box icon-red"><i class="fa-solid fa-stopwatch"></i></div>
                <div class="qa-info">
                  <span class="qa-title">Pomodoro Timer</span>
                  <span class="qa-desc">25m focus & break cycles</span>
                </div>
              </button>
            </div>
          </section>

          <!-- ==========================================
               5. SMART STUDY CALENDAR
               ========================================== -->
          <section class="glass-card calendar-section-card" id="smartCalendarCard">
            <div class="calendar-header-row">
              <div class="cal-title-group">
                <h3><i class="fa-solid fa-calendar-check text-indigo"></i> Smart Study Calendar</h3>
                <span class="cal-sub-text">Interactive monthly schedule & deadline tracker</span>
              </div>
              <div class="cal-controls">
                <button class="btn-icon-pill" id="calPrevMonthBtn" title="Previous Month"><i class="fa-solid fa-chevron-left"></i></button>
                <span class="calendar-month-title" id="calCurrentMonthTitle">August 2026</span>
                <button class="btn-icon-pill" id="calNextMonthBtn" title="Next Month"><i class="fa-solid fa-chevron-right"></i></button>
                <button class="btn-secondary-pill" id="calTodayBtn">Today</button>
              </div>
            </div>

            <!-- Calendar Legend Badges -->
            <div class="calendar-legend-bar">
              <span class="legend-item"><span class="dot dot-study"></span> Study Days</span>
              <span class="legend-item"><span class="dot dot-exam"></span> Exam Dates</span>
              <span class="legend-item"><span class="dot dot-deadline"></span> Deadlines</span>
              <span class="legend-item"><span class="dot dot-holiday"></span> Holidays</span>
            </div>

            <!-- Calendar Table Grid -->
            <div class="calendar-grid-container">
              <div class="cal-day-header">Sun</div>
              <div class="cal-day-header">Mon</div>
              <div class="cal-day-header">Tue</div>
              <div class="cal-day-header">Wed</div>
              <div class="cal-day-header">Thu</div>
              <div class="cal-day-header">Fri</div>
              <div class="cal-day-header">Sat</div>

              <!-- Calendar Days Grid Rendered dynamically by JS -->
              <div class="calendar-days-grid" id="calendarDaysGrid"></div>
            </div>
          </section>

          <!-- ==========================================
               6. TODAY'S TASKS
               ========================================== -->
          <section class="glass-card task-manager-card" id="todaysTasksCard">
            <div class="task-card-header">
              <div class="title-with-badge">
                <h3><i class="fa-solid fa-list-check text-emerald"></i> Today's Study Tasks</h3>
                <span class="task-count-badge" id="taskManagerCounter">5 / 7 Tasks Completed</span>
              </div>
              <button class="btn-primary-gradient" id="addNewTaskTopBtn">
                <i class="fa-solid fa-plus"></i> Add New Task
              </button>
            </div>

            <!-- Task Controls Bar (Filter Pills & Search) -->
            <div class="task-controls-bar">
              <div class="filter-pills" id="taskFilterPills">
                <button class="pill-btn active" data-filter="all">All Tasks</button>
                <button class="pill-btn" data-filter="pending">Pending</button>
                <button class="pill-btn" data-filter="completed">Completed</button>
                <button class="pill-btn" data-filter="high">High Priority</button>
                <button class="pill-btn" data-filter="math">Mathematics</button>
                <button class="pill-btn" data-filter="cs">Computer Science</button>
              </div>
              <div class="task-search-input-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="taskFilterInput" placeholder="Filter tasks...">
              </div>
            </div>

            <!-- Task List Container -->
            <div class="task-list-container" id="tasksListContainer">
              <!-- Rendered via JS -->
            </div>
          </section>

          <!-- ==========================================
               7. UPCOMING TASKS
               ========================================== -->
          <section class="glass-card upcoming-tasks-card" id="upcomingTasksCard">
            <div class="section-title-row">
              <h3><i class="fa-solid fa-clock-rotate-left text-cyan"></i> Upcoming Tasks & Assignments</h3>
              <span class="section-badge">Next 7 Days</span>
            </div>

            <div class="upcoming-tasks-list" id="upcomingTasksList">
              <!-- Rendered dynamically via JS -->
            </div>
          </section>

          <!-- ==========================================
               8. SUBJECT PLANNER
               ========================================== -->
          <section class="planner-section-block" id="subjectPlannerCard">
            <div class="section-title-row">
              <h3><i class="fa-solid fa-book-open-reader text-purple"></i> Subject Planner & Progress</h3>
              <a href="subjects.html" class="view-all-link">Manage All Subjects <i class="fa-solid fa-arrow-right"></i></a>
            </div>

            <div class="subject-cards-grid" id="subjectCardsGrid">
              <!-- Rendered via JS -->
            </div>
          </section>

          <!-- ==========================================
               9. POMODORO TIMER
               ========================================== -->
          <section class="glass-card pomodoro-card" id="pomodoroTimerCard">
            <div class="pomodoro-header">
              <div>
                <h3><i class="fa-solid fa-stopwatch text-rose"></i> Focus Pomodoro Timer</h3>
                <p class="sub-text">Boost productivity with structured study sprints & breaks</p>
              </div>
              <div class="pomo-session-badge">
                <i class="fa-solid fa-fire text-amber"></i> Completed Sessions Today: <strong id="pomoSessionCount">4</strong> / 8
              </div>
            </div>

            <div class="pomodoro-body">
              <!-- Mode Tabs -->
              <div class="pomo-tabs" id="pomoTabs">
                <button class="pomo-tab active" data-mode="focus" data-time="1500">25m Focus</button>
                <button class="pomo-tab" data-mode="shortBreak" data-time="300">5m Short Break</button>
                <button class="pomo-tab" data-mode="longBreak" data-time="900">15m Long Break</button>
              </div>

              <!-- Timer Display Ring -->
              <div class="pomo-timer-display">
                <svg class="pomo-ring-svg" width="220" height="220">
                  <circle class="pomo-ring-bg" cx="110" cy="110" r="95"></circle>
                  <circle class="pomo-ring-fill" id="pomoRingFill" cx="110" cy="110" r="95"></circle>
                </svg>
                <div class="pomo-center-text">
                  <span class="pomo-time-digits" id="pomoTimeDigits">25:00</span>
                  <span class="pomo-mode-label" id="pomoModeLabel">Focus Session</span>
                </div>
              </div>

              <!-- Control Buttons -->
              <div class="pomo-controls-row">
                <button class="btn-primary-gradient pomo-btn-lg" id="pomoStartBtn">
                  <i class="fa-solid fa-play"></i> Start Timer
                </button>
                <button class="btn-secondary-pill pomo-btn-lg" id="pomoResetBtn">
                  <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
              </div>
            </div>
          </section>

          <!-- ==========================================
               10. WEEKLY STUDY TIMETABLE
               ========================================== -->
          <section class="glass-card timetable-card" id="weeklyTimetableCard">
            <div class="section-title-row">
              <div>
                <h3><i class="fa-solid fa-table-cells text-indigo"></i> Weekly Study Timetable</h3>
                <p class="sub-text">Structured study allocation per time block</p>
              </div>
              <span class="section-badge">Mon &ndash; Sun Schedule</span>
            </div>

            <div class="timetable-overflow-wrap">
              <table class="timetable-grid" id="timetableGrid">
                <thead>
                  <tr>
                    <th>Time Slot</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                    <th>Sat</th>
                    <th>Sun</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td class="slot-label"><i class="fa-regular fa-sun text-amber"></i> Morning<br><span class="time-range">08:00 - 12:00</span></td>
                    <td class="cell-block bg-math">Mathematics<span class="block-topic">Calculus</span></td>
                    <td class="cell-block bg-cs">Computer Science<span class="block-topic">Data Struct.</span></td>
                    <td class="cell-block bg-math">Mathematics<span class="block-topic">Linear Alg.</span></td>
                    <td class="cell-block bg-physics">Physics<span class="block-topic">Mechanics</span></td>
                    <td class="cell-block bg-cs">Computer Science<span class="block-topic">Algorithms</span></td>
                    <td class="cell-block bg-chem">Chemistry<span class="block-topic">Lab Work</span></td>
                    <td class="cell-block bg-free">Free Revision</td>
                  </tr>
                  <tr>
                    <td class="slot-label"><i class="fa-solid fa-sun text-amber"></i> Afternoon<br><span class="time-range">12:00 - 17:00</span></td>
                    <td class="cell-block bg-physics">Physics<span class="block-topic">Electromagnetism</span></td>
                    <td class="cell-block bg-chem">Chemistry<span class="block-topic">Organic Chem</span></td>
                    <td class="cell-block bg-bio">Biology<span class="block-topic">Genetics</span></td>
                    <td class="cell-block bg-english">English<span class="block-topic">Literature Essay</span></td>
                    <td class="cell-block bg-physics">Physics<span class="block-topic">Quantum Intro</span></td>
                    <td class="cell-block bg-math">Mathematics<span class="block-topic">Problem Set</span></td>
                    <td class="cell-block bg-bio">Biology<span class="block-topic">Cellular Bio</span></td>
                  </tr>
                  <tr>
                    <td class="slot-label"><i class="fa-solid fa-moon text-indigo"></i> Evening<br><span class="time-range">17:00 - 21:00</span></td>
                    <td class="cell-block bg-cs">AI Assistant Sprints</td>
                    <td class="cell-block bg-math">Math Practice</td>
                    <td class="cell-block bg-chem">Chem Notes</td>
                    <td class="cell-block bg-cs">Code Projects</td>
                    <td class="cell-block bg-english">English Reading</td>
                    <td class="cell-block bg-free">Quiz Tests</td>
                    <td class="cell-block bg-free">Weekly Review</td>
                  </tr>
                  <tr>
                    <td class="slot-label"><i class="fa-solid fa-bed text-purple"></i> Night<br><span class="time-range">21:00 - 00:00</span></td>
                    <td class="cell-block bg-free">Flashcards</td>
                    <td class="cell-block bg-free">Light Reading</td>
                    <td class="cell-block bg-free">Flashcards</td>
                    <td class="cell-block bg-free">Rest & Plan</td>
                    <td class="cell-block bg-free">Light Reading</td>
                    <td class="cell-block bg-free">Rest</td>
                    <td class="cell-block bg-free">Schedule Next Wk</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <!-- ==========================================
               11. GOALS SECTION
               ========================================== -->
          <section class="glass-card goals-card" id="goalsSectionCard">
            <div class="section-title-row">
              <h3><i class="fa-solid fa-bullseye text-emerald"></i> Academic Goals & Target Milestones</h3>
              <span class="section-badge">Completion Trackers</span>
            </div>

            <div class="goals-grid">
              <!-- Daily Goal -->
              <div class="goal-item-box">
                <div class="goal-header">
                  <span class="goal-title"><i class="fa-solid fa-sun text-amber"></i> Daily Goal</span>
                  <span class="goal-pct">78%</span>
                </div>
                <div class="goal-bar-bg">
                  <div class="goal-bar-fill fill-amber" style="width: 78%;"></div>
                </div>
                <div class="goal-footer">
                  <span>3.5 / 4.5 Hours Logged</span>
                  <span class="goal-status text-emerald"><i class="fa-solid fa-check"></i> On Track</span>
                </div>
              </div>

              <!-- Weekly Goal -->
              <div class="goal-item-box">
                <div class="goal-header">
                  <span class="goal-title"><i class="fa-solid fa-calendar-week text-indigo"></i> Weekly Goal</span>
                  <span class="goal-pct">75%</span>
                </div>
                <div class="goal-bar-bg">
                  <div class="goal-bar-fill fill-indigo" style="width: 75%;"></div>
                </div>
                <div class="goal-footer">
                  <span>22.5 / 30.0 Hours Completed</span>
                  <span class="goal-status text-indigo">7.5h Remaining</span>
                </div>
              </div>

              <!-- Monthly Goal -->
              <div class="goal-item-box">
                <div class="goal-header">
                  <span class="goal-title"><i class="fa-solid fa-calendar-alt text-purple"></i> Monthly Goal</span>
                  <span class="goal-pct">82%</span>
                </div>
                <div class="goal-bar-bg">
                  <div class="goal-bar-fill fill-purple" style="width: 82%;"></div>
                </div>
                <div class="goal-footer">
                  <span>98 / 120 Hours Logged</span>
                  <span class="goal-status text-emerald"><i class="fa-solid fa-fire"></i> High Pace</span>
                </div>
              </div>
            </div>
          </section>

          <!-- ==========================================
               12. AI STUDY SUGGESTIONS
               ========================================== -->
          <section class="planner-section-block" id="aiSuggestionsCard">
            <div class="section-title-row">
              <h3><i class="fa-solid fa-wand-magic-sparkles text-indigo"></i> AI Study Recommendations</h3>
              <span class="section-badge">Personalized for Alex</span>
            </div>

            <div class="ai-suggestions-grid">
              <div class="ai-recommend-card">
                <div class="ai-rec-icon bg-indigo-glow"><i class="fa-solid fa-calculator"></i></div>
                <div class="ai-rec-content">
                  <span class="ai-rec-tag">Priority Recommendation</span>
                  <h4 class="ai-rec-title">Study Mathematics Calculus First</h4>
                  <p class="ai-rec-desc">Calculus Midterm exam is in 3 days. Focus on Integration by Parts today for maximum score boost.</p>
                  <button class="ai-action-btn" id="aiActionStartMath"><i class="fa-solid fa-play"></i> Start Math Sprint</button>
                </div>
              </div>

              <div class="ai-recommend-card">
                <div class="ai-rec-icon bg-cyan-glow"><i class="fa-solid fa-atom"></i></div>
                <div class="ai-rec-content">
                  <span class="ai-rec-tag">Review Alert</span>
                  <h4 class="ai-rec-title">Review Yesterday's Physics Notes</h4>
                  <p class="ai-rec-desc">You completed Electromagnetism yesterday. Review formula cards today to solidify long-term memory.</p>
                  <button class="ai-action-btn" id="aiActionReviewPhysics"><i class="fa-solid fa-rotate"></i> Review Physics</button>
                </div>
              </div>

              <div class="ai-recommend-card">
                <div class="ai-rec-icon bg-emerald-glow"><i class="fa-solid fa-dna"></i></div>
                <div class="ai-rec-content">
                  <span class="ai-rec-tag">Quiz Practice</span>
                  <h4 class="ai-rec-title">Take a 10-Question Biology Quiz</h4>
                  <p class="ai-rec-desc">Test your retention on Cell Division & Mitosis before tomorrow's lecture.</p>

  <!-- ==========================================
       MODAL DIALOG: ADD / EDIT TASK
       ========================================== -->
  <div class="modal-backdrop hidden" id="addTaskModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="taskModalTitle"><i class="fa-solid fa-plus text-indigo"></i> Add New Task</h3>
        <button class="modal-close-btn" id="closeTaskModalBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="taskForm" class="modal-form">
        <input type="hidden" id="taskIdInput" value="">
        
        <div class="form-group">
          <label for="taskNameInput">Task Name *</label>
          <input type="text" id="taskNameInput" placeholder="e.g. Calculus Integration Practice Set" required>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="taskSubjectSelect">Subject *</label>
            <select id="taskSubjectSelect" required>
              <option value="Mathematics">Mathematics</option>
              <option value="Physics">Physics</option>
              <option value="Chemistry">Chemistry</option>
              <option value="Biology">Biology</option>
              <option value="English">English</option>
              <option value="Computer Science">Computer Science</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskPrioritySelect">Priority *</label>
            <select id="taskPrioritySelect" required>
              <option value="High">High Priority</option>
              <option value="Medium" selected>Medium Priority</option>
              <option value="Low">Low Priority</option>
            </select>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="taskStartTimeInput">Start Time</label>
            <input type="text" id="taskStartTimeInput" placeholder="e.g. 02:00 PM">
          </div>

          <div class="form-group">
            <label for="taskDurationInput">Est. Duration</label>
            <input type="text" id="taskDurationInput" placeholder="e.g. 45 mins">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary-pill" id="cancelTaskModalBtn">Cancel</button>
          <button type="submit" class="btn-primary-gradient"><i class="fa-solid fa-check"></i> Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
